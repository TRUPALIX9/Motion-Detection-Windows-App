<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">ZoneWatch architecture</title>
<desc id="d">An IP camera on the camera network sends RTSP video to the ZoneWatch Motion Detection app and to the MyService Windows service on a Windows PC. The PTZ Controls window, opened from the main window, sends ONVIF SOAP 1.2 commands with HTTP digest auth to the camera. MyService writes motion events to the Windows Event Log and starts FFmpeg on motion; the Stream Forwarding tool starts and stops FFmpeg by hand. FFmpeg pulls the camera's RTSP stream and copies it to an RTSP server.</desc>
<defs>
