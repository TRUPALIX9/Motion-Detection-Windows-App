<symbol id="zw-icon" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="url(#zw-ibg)"/><path d="M170 182H342L420 374H92Z" fill="#3D5CFF" fill-opacity="0.2" stroke="#5B7CFF" stroke-width="32" stroke-linejoin="round"/><rect x="196" y="138" width="120" height="180" fill="none" stroke="#FF4A43" stroke-width="30"/><circle cx="256" cy="228" r="22" fill="#FF4A43"/></symbol>
