<linearGradient id="zw-asphalt" x1="0" y1="176" x2="0" y2="360" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8E9298"/><stop offset="1" stop-color="#62676E"/></linearGradient>
<radialGradient id="zw-vig" cx="50%" cy="50%" r="75%"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.28"/></radialGradient>
